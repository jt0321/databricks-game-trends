[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-trends"
version = "0.1.0"
description = "Game Trend Lakehouse — public-Steam medallion pipeline for Databricks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jt0321" }]
dependencies = [
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
# Only needed for `game-trends-backfill --sources trends`; Google Trends has
# no official API, so this pulls in the unofficial `pytrends` client.
# Imported lazily (see extract_backfill.backfill_google_trends) so the rest
# of the pipeline — including the full test suite — never requires it.
trends = ["pytrends>=4.9,<5.0"]

[dependency-groups]
dev = [
    "pytest>=7.4,<9.0",
]

[project.scripts]
game-trends-extract = "game_trends.extract_steam:main"
game-trends-extract-engagement = "game_trends.extract_engagement:main"
game-trends-extract-estimates = "game_trends.extract_estimates:main"
game-trends-backfill = "game_trends.extract_backfill:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
